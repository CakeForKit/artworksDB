services:
  app:
    container_name: app_artworks_dev
    build:
      context: ../
      dockerfile: ./cmd/app/Dockerfile.dev  # production - ./cmd/app/Dockerfile (образ меньше)
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=debug
      - AIR_WATCH=.  # Следить за изменениями во всей директории
      - POSTGRES_HOST=postgres_artworks
      - APP_EMAIL_PASSWORD=${APP_EMAIL_PASSWORD}
      - APP_EMAIL=${APP_EMAIL}
      - TEST_USER_EMAIL=${TEST_USER_EMAIL}
      - TEST_USER_EMAIL_PASSWORD=${TEST_USER_EMAIL_PASSWORD}
      # 
      - TRACING_ENABLED=true
      - JAEGER_URL=http://jaeger:4318
      - SERVICE_NAME=artworks-app
    volumes:
      - ../:/app          # Монтируем весь проект в контейнер
      - /app/go/pkg/mod   # Кэш для модулей Go
      - /app/bin          # Для бинарников (если нужно)
    depends_on:
      postgres:
        condition: service_healthy
    command: air -c ./cmd/app/.air.toml  # Заменяем стандартную команду на air
    networks:
      - postgres-db
      - redis_artworks
      - jaeger-network
      - metrics-network

  jaeger:
    container_name: jaeger_artworks
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"    # Web UI
      - "4318:4318"    # HTTP collector endpoint
    networks:
      - jaeger-network

  prometheus:
    container_name: prometheus_artworks
    hostname: testprom
    image: prom/prometheus:latest
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - metrics-network

  cadvisortest:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisortest
    hostname: cadvisortest
    ports:
      - "8081:8081"
    command: ["-port", "8081"]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /mnt/windows_docker/:/var/lib/docker:ro # особенность wsl
      - /mnt/windows_docker/:/rootfs/var/lib/docker:ro  # особенность wsl
    networks:
      - metrics-network

  postgres:
    container_name: postgres_artworks
    hostname: postgres
    image: postgres:14.8-alpine3.18
    env_file:
      - ../configs/db.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - postgres-db

  migrator:
    container_name: migrator_artworks
    depends_on:
      postgres:
        condition: service_healthy  
    env_file:
      - ../configs/db.env
    environment:
      - POSTGRES_HOST=postgres_artworks
    build:
      context: ../migrations
      dockerfile: Dockerfile
    networks:
      - postgres-db
      
  redis_artworks:
    container_name: redis_artworks
    hostname: redis_artworks
    build:
      context: ./redis
      dockerfile: ./Dockerfile
    env_file:
      - ../configs/redis.env
    networks:
      - redis_artworks
    labels:
      - "project=artworks"
  
  clickhouse_artworks:
    container_name: clickhouse_artworks
    hostname: clickhouse_artworks
    image: clickhouse/clickhouse-server:23.8-alpine
    ports:
      - "8123:8123"  
      - "9000:9000"  
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # - ../configs/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      # - ../configs/clickhouse/config.xml:/etc/clickhouse-server/config.xml
    env_file:
      - ../configs/clickhouse.env
    networks:
      - clickhouse-db
    healthcheck:
      # "clickhouse", "client", "-u ${CLICKHOUSE_USER}", "--password ${CLICKHOUSE_PASSWORD}", "-q 'SELECT 1'"
      test: wget --no-verbose --tries=1 http://127.0.0.1:8123/ping || exit 1
      interval: 10s
      timeout: 10s
      retries: 3
      
  clickhouse_migrator_artworks:
    container_name: clickhouse_migrator_artworks
    depends_on:
      clickhouse_artworks:
        condition: service_healthy
    env_file:
      - ../configs/clickhouse.env
    build:
      context: ../migrations/clickhouse
      dockerfile: Dockerfile
    networks:
      - clickhouse-db
    labels:
      - "project=artworks"

volumes:
  clickhouse-data:
  pg-db-volume:
    driver: local


networks:
  postgres-db:
    name: postgres-db
  redis_artworks:
    name: redis_artworks
  clickhouse-db:
    name: clickhouse-db
  jaeger-network:
    name: jaeger-network
  metrics-network:
    name: metrics-network
