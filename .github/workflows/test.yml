name: Tests

on:
  push:
    branches: [ "*" ]

# -tags=integration

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        cache-dependency-path: go.sum
    - name: Run Unit Tests
      run: go test -v -shuffle=on git.iu7.bmstu.ru/ped22u691/PPO.git/internal/services/... 

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests 
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose -f ./deployment/docker-compose.ci.yml \
            --env-file ./configs/test_db.env build
          docker ps

      - name: Run Integration Tests
        run: |
          docker compose -f ./deployment/docker-compose.ci.yml \
            --env-file ./configs/test_db.env \
            run --rm test-runner \
            go test -v -shuffle=on git.iu7.bmstu.ru/ped22u691/PPO.git/internal/tests/integration 

      - name: Cleanup
        if: always()
        run: |
          docker compose -f ./deployment/docker-compose.ci.yml \
            down -v --remove-orphans

        