name: Integration Test 

on:
  push:
    branches: [ "*" ]

# -tags=integration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug working directory
        run: |
          echo "Current directory: $(pwd)"
          ls -la deployment/

      - name: Build Docker images
        run: |
          echo "Current directory: $(pwd)"
          docker compose -f ./deployment/docker-compose.ci.yml --env-file ./configs/db.env build

      - name: Run Integration Tests
        run: |
          echo "Current directory: $(pwd)"
          docker compose -f ./deployment/docker-compose.ci.yml --env-file ../configs/db.env run --rm test-runner go test  ./... 

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

        